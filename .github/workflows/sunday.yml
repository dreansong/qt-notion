name: Sunday worship note
on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor poppler-utils
      - run: pip install pillow
      - run: python sunday_note.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
